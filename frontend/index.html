<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataForge Phase 1</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f7f7f7; color: #1f2937; }
      .card { background: white; border-radius: 10px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
      button { background: #2563eb; color: white; border: none; padding: 0.75rem 1rem; border-radius: 6px; cursor: pointer; }
      pre { background: #111827; color: #e5e7eb; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <h1>DataForge</h1>
    <div class="card">
      <h2>Upload dataset</h2>
      <input id="dataset-file" type="file" accept=".csv,.xlsx,.xls" />
      <button id="analyze-button">Analyze dataset</button>
      <p id="status">Waiting for file upload.</p>
    </div>

    <div class="card">
      <h2>Dataset overview</h2>
      <pre id="overview">{}</pre>
    </div>

    <div class="card">
      <h2>Data quality summary</h2>
      <pre id="quality-summary">{}</pre>
    </div>

    <div class="card">
      <h2>Report output</h2>
      <pre id="report-output">{}</pre>
    </div>

    <script src="app.js"></script>
  </body>
</html>
